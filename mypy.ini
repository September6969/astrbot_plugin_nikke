[mypy]
python_version = 3.13
files =
    application/commands/contracts.py,
    application/commands/campaign.py,
    application/commands/character.py,
    application/commands/profile.py,
    application/commands/raid.py,
    features/account/errors.py,
    features/announcement/ports.py,
    features/announcement/service.py,
    features/announcement/synchronization.py,
    features/calendar/ports.py,
    features/calendar/schedule_adapters.py,
    features/calendar/schedule_service.py,
    features/cdk/ports.py,
    features/cdk/service.py,
    features/character/ports.py,
    features/character/application.py,
    features/character/face_anchor.py,
    features/character/face_guided_centering.py,
    features/daily/errors.py,
    features/daily/ports.py,
    features/daily/runner.py,
    features/tarot/ports.py,
    features/tarot/service.py,
    integrations/announcement/information_feeds.py,
    integrations/announcement/official_source.py,
    integrations/calendar/visual_cache.py,
    integrations/character/stat_resources.py,
    integrations/voice/resource_provider.py,
    integrations/tarot/images.py,
    integrations/blablalink/errors.py,
    core/container.py,
    core/providers/announcement.py,
    core/providers/character.py,
    core/providers/tarot.py,
    core/providers/voice.py,
    ui/payloads/character.py,
    ui/renderers/t2i.py
mypy_path = .
namespace_packages = True
explicit_package_bases = True
check_untyped_defs = True
disallow_any_generics = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unused_configs = True
ignore_missing_imports = True
follow_imports = silent

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; font-src data:; style-src 'unsafe-inline'; script-src 'none'">
<style>
<!-- SHARED_CSS -->
* { box-sizing: border-box; }
html, body { margin: 0; width: 1080px; background: #edf1f2; color: #24313a; }
body { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
.info { width: 1080px; height: {{ canvas.height }}px; padding: 44px 52px; background: radial-gradient(ellipse at 16% 12%, #fff 0, #f3f7f7 42%, #e7edef 100%); }
.header { display: flex; align-items: center; gap: 32px; min-height: 220px; padding: 28px 34px; border: 1px solid #d7e0e2; border-radius: 24px; background: rgba(255,255,255,.88); box-shadow: 0 12px 32px rgba(35,55,64,.08); }
.portrait { display: grid; flex: 0 0 160px; width: 160px; height: 160px; overflow: hidden; place-items: center; border: 3px solid #b8d3d7; border-radius: 22px; background: linear-gradient(145deg,#e2eaec,#f8fbfb); color: #557078; font-size: 22px; font-weight: 700; text-align: center; }
.portrait img { display: block; width: 100%; height: 100%; object-fit: cover; }
.eyebrow { color: #477d88; font-size: 20px; font-weight: 800; letter-spacing: 2px; }
h1 { margin: 14px 0 8px; color: #202c33; font-size: 52px; line-height: 1.12; overflow-wrap: anywhere; }
.subtitle { color: #68777d; font-size: 26px; }
.rows { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 24px; }
.row { min-height: 78px; padding: 15px 20px; border: 1px solid #dce4e5; border-radius: 16px; background: #fff; }
.label { color: #718087; font-size: 20px; font-weight: 700; }
.value { margin-top: 6px; color: #2e3b42; font-size: 25px; line-height: 1.22; font-weight: 700; overflow-wrap: anywhere; }
footer { margin-top: 19px; color: #78858a; font-size: 17px; line-height: 1.35; }
</style>
</head>
<body>
<main class="info" data-row-count="{{ rows|length }}">
  <header class="header">
    <div class="portrait">
      {% if portrait_data_uri %}<img src="{{ portrait_data_uri }}" alt="{{ name }}">
      {% else %}<span>{{ portrait_label }}</span>{% endif %}
    </div>
    <div>
      <div class="eyebrow">NIKKE / PUBLIC CHARACTER DIRECTORY</div>
      <h1>{{ name }}</h1>
      <div class="subtitle">{{ title }}</div>
    </div>
  </header>
  <section class="rows">
    {% for row in rows %}<article class="row"><div class="label">{{ row.label }}</div><div class="value">{{ row.value }}</div></article>{% endfor %}
  </section>
  <footer>{{ footer }}</footer>
</main>
</body>
</html>

name: CI

on:
  push:
    branches: [ master, main, feat/overnight-backlog ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  extension:
    name: Extension (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run extension contract tests
        run: node --test tests/extension.test.cjs

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      PYTHONPATH: ${{ github.workspace }}/..

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio astrbot

      - name: Check syntax and compilation
        run: |
          python -m compileall -q .

      - name: Check package import
        run: |
          python -c "import astrbot_plugin_nikke; print('Package import successful')"

      - name: Run pytest test suite
        run: |
          pytest -v

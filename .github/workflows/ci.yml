name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  spine-runtime-build:
    name: Spine 4.0 headless worker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned official runtime worker
        run: |
          docker build \
            --file runtime/spine_worker/Dockerfile \
            --tag nikke-spine-worker:ci \
            runtime/spine_worker
      - name: Render public default and non-default Spine bundles
        run: |
          set -eu
          mkdir -p .ci-spine-assets/c010 .ci-spine-assets/c010_01
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/Nikke-db/Nikke-db.github.io/main/l2d/c010/c010_00.skel \
            --output .ci-spine-assets/c010/c010_00.skel
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/Nikke-db/Nikke-db.github.io/main/l2d/c010/c010_00.atlas \
            --output .ci-spine-assets/c010/c010_00.atlas
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/Nikke-db/Nikke-db.github.io/main/l2d/c010/c010_00.png \
            --output .ci-spine-assets/c010/c010_00.png
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/Nikke-db/Nikke-db.github.io/main/l2d/c010_01/c010_01_00.skel \
            --output .ci-spine-assets/c010_01/c010_01_00.skel
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/Nikke-db/Nikke-db.github.io/main/l2d/c010_01/c010_01_00.atlas \
            --output .ci-spine-assets/c010_01/c010_01_00.atlas
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/Nikke-db/Nikke-db.github.io/main/l2d/c010_01/c010_00.png \
            --output .ci-spine-assets/c010_01/c010_00.png
          docker run --rm \
            --volume "$PWD/.ci-spine-assets:/bundles" \
            nikke-spine-worker:ci \
            --skeleton /bundles/c010/c010_00.skel \
            --atlas /bundles/c010/c010_00.atlas \
            --output /bundles/c010/default.rgba \
            --width 512 --height 512
          docker run --rm \
            --volume "$PWD/.ci-spine-assets:/bundles" \
            nikke-spine-worker:ci \
            --skeleton /bundles/c010_01/c010_01_00.skel \
            --atlas /bundles/c010_01/c010_01_00.atlas \
            --output /bundles/c010_01/non-default.rgba \
            --width 512 --height 512
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          for raw_path, png_path in (
              (Path(".ci-spine-assets/c010/default.rgba"), Path(".ci-spine-assets/c010/default.png")),
              (Path(".ci-spine-assets/c010_01/non-default.rgba"), Path(".ci-spine-assets/c010_01/non-default.png")),
          ):
              data = raw_path.read_bytes()
              width = int.from_bytes(data[0:4], "little")
              height = int.from_bytes(data[4:8], "little")
              assert len(data) == 8 + width * height * 4
              image = Image.frombytes("RGBA", (width, height), data[8:])
              assert image.getbbox() is not None
              image.save(png_path, format="PNG")
          PY
      - name: Upload viewed Spine render previews
        uses: actions/upload-artifact@v4
        with:
          name: spine-render-smoke
          path: .ci-spine-assets/**/*.png
          if-no-files-found: error

  extension:
    name: Extension (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run extension contract tests
        run: node --test tests/extension.test.cjs

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    env:
      PYTHONPATH: ${{ github.workspace }}/..

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio astrbot

      - name: Check syntax and compilation
        run: |
          python -m compileall -q .

      - name: Check package import
        run: |
          python -c "import astrbot_plugin_nikke; print('Package import successful')"

      - name: Run pytest test suite
        run: |
          pytest -v

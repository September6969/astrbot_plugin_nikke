<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NIKKE QQ 安全绑定</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 380px;
      max-width: 100vw;
      margin: 0;
      padding: 20px;
      background: #111318;
      color: #f2f3f5;
      font: 14px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 8px 0;
      color: #ffffff;
      border-left: 3px solid #e9b85a;
      padding-left: 10px;
    }
    .security-note {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .status-card {
      background: #1a1e25;
      border: 1px solid #343b46;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }
    .status-title {
      font-size: 11px;
      text-transform: uppercase;
      color: #9ca3af;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .indicator-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .indicator-dot.online { background: #8fbca2; box-shadow: 0 0 6px rgba(143, 188, 162, 0.6); }
    .indicator-dot.offline { background: #e9b85a; box-shadow: 0 0 6px rgba(233, 184, 90, 0.6); }
    .indicator-dot.checking { background: #9ca3af; }
    .char-badge {
      margin-top: 6px;
      font-size: 12px;
      color: #e9b85a;
      background: rgba(233, 184, 90, 0.1);
      padding: 3px 8px;
      border-radius: 4px;
      display: inline-block;
    }
    label {
      display: block;
      margin-top: 14px;
      font-weight: 600;
      font-size: 13px;
      color: #d1d5db;
    }
    input {
      font: inherit;
      width: 100%;
      min-height: 42px;
      margin-top: 6px;
      padding: 9px 12px;
      border-radius: 6px;
      background: #1a1e25;
      border: 1px solid #434c5e;
      color: #f2f3f5;
      font-size: 13px;
    }
    input:focus {
      outline: none;
      border-color: #e9b85a;
    }
    input::placeholder { color: #6b7280; }
    button {
      font: inherit;
      width: 100%;
      min-height: 44px;
      margin-top: 10px;
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    button.primary {
      background: #e9b85a;
      color: #111318;
    }
    button.primary:hover:not(:disabled) {
      background: #f0c575;
    }
    button.secondary {
      background: #222731;
      color: #e5e7eb;
      border: 1px solid #434c5e;
    }
    button.secondary:hover {
      background: #2b3240;
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    :focus-visible {
      outline: 2px solid #e9b85a;
      outline-offset: 2px;
    }
    .status {
      min-height: 48px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #2e3542;
      font-size: 13px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }
    .status[data-state="pending"] { color: #e9b85a; }
    .status[data-state="success"] { color: #8fbca2; font-weight: 600; }
    .status[data-state="error"] { color: #e3a1a1; }
  </style>
</head>
<body>
  <h1>NIKKE QQ 安全绑定</h1>
  <div class="security-note">仅提交完成绑定所需的登录会话信息，不会读取或上传你的账号密码。</div>

  <div class="status-card">
    <div class="status-title">当前状态</div>
    <div class="status-indicator">
      <span id="loginDot" class="indicator-dot checking"></span>
      <span id="loginStatusText">正在检测 BlaBlaLink 登录状态…</span>
    </div>
    <div id="charPreview" class="char-badge" style="display: none;"></div>
  </div>

  <label for="bindUrl">机器人绑定链接</label>
  <input id="bindUrl" type="url" autocomplete="off" spellcheck="false" placeholder="粘贴机器人给出的绑定链接">

  <button id="openLogin" class="secondary" type="button">打开 BlaBlaLink 官网登录</button>
  <button id="submit" class="primary" type="button">已登录，提交绑定</button>

  <div id="status" class="status" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="popup.js"></script>
</body>
</html>

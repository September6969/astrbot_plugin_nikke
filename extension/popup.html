<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NIKKE安全绑定</title>
  <style>
    *{box-sizing:border-box}
    body{width:380px;max-width:100vw;margin:0;padding:24px;background:#111318;color:#f2f3f5;font:14px/1.6 system-ui,sans-serif}
    h1{font-size:21px;margin:0 0 12px;border-left:3px solid #e9b85a;padding-left:12px}
    label{display:block;margin-top:24px;font-weight:600}
    input,button{font:inherit;width:100%;min-height:46px;margin-top:10px;padding:11px 12px;border-radius:8px}
    input{background:#1a1e25;border:1px solid #566170;color:#f2f3f5}
    input::placeholder{color:#a9b2c0}
    button{border:1px solid transparent;background:#e9b85a;color:#111318;font-weight:700;cursor:pointer}
    button.secondary{background:#222731;color:#f2f3f5;border-color:#566170}
    :focus-visible{outline:3px solid #e9b85a;outline-offset:3px}
    button:disabled{opacity:.55;cursor:wait}
    .status{min-height:56px;margin-top:20px;padding-top:16px;border-top:1px solid #343b46;white-space:pre-wrap;overflow-wrap:anywhere}
    .status[data-state="pending"]{color:#e9b85a}
    .status[data-state="success"]{color:#8fbca2}
    .status[data-state="error"]{color:#e3a1a1}
    small{display:block;color:#a9b2c0}
  </style>
</head>
<body>
  <h1>NIKKE QQ 安全绑定</h1>
  <small>账号密码只输入在BlaBlaLink官网。本扩展仅提交必要Cookie。</small>
  <label for="bindUrl">机器人绑定链接</label>
  <input id="bindUrl" type="url" autocomplete="off" spellcheck="false" placeholder="粘贴机器人给出的绑定链接">
  <button id="openLogin" class="secondary">1. 打开BlaBlaLink官网登录</button>
  <button id="submit">2. 已登录，提交绑定</button>
  <div id="status" class="status" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="popup.js"></script>
</body>
</html>
